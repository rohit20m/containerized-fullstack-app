<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page</title>
    <style>
        body {
            text-align: center;
        }

        #formBtn {
            color: white;
            background-color: cornflowerblue;
            border: none;
            border-radius: 2px;
            padding: 0.25rem 1rem;
            margin-top: 1rem;
            cursor: pointer;
            font-size: 1rem;
        }

        form {
            border: 2px solid grey;
            display: inline-block;
            padding: 2rem;
        }

        .field {
            margin-bottom: 0.5rem;
        }
    </style>
</head>
<body>
    <p>Hi User, Welcome to our App!</p>
    <p>You can sign up to the platform to access all important notifications.</p>

    <form action="/adduser" method="POST" target="_blank" id="signupForm">
        <div class="field">
            <label for="email">Email:</label>
            <input type="text" placeholder="johndoe@email.com" name="email">
        </div>
        <div class="field">
            <label for="username">Username:</label>
            <input type="text" placeholder="John Doe" name="username">
        </div>
        <div class="field">
            <label for="password">Password:</label>
            <input type="password" placeholder="Password" name="password">
        </div>
        <button id="formBtn" onclick="resetForm()">Sign up</button>
        <!-- <button id="formBtn">Sign up</button> -->

    </form>

    <script>
        function resetForm() {
        // We use setTimeout to wait 100 milliseconds (0.1 seconds)
        // This gives the browser time to submit the data first!
        setTimeout(() => {
            let myForm = document.getElementById("signupForm");
            myForm.reset(); // Safely clear the form now!
        }, 100);
    }
    </script>
</body>
</html>
